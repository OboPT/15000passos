<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passos até ao fim do ano</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1b1f24; --mut:#6b7280; --ac:#2563eb; --bd:#e5e7eb;
          --ok:#16a34a; --near:#f59e0b; --low:#ef4444; --none:#d1d5db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f26; --tx:#e8eaed; --mut:#9aa3af; --ac:#60a5fa; --bd:#2a313a;
            --ok:#4ade80; --near:#fbbf24; --low:#f87171; --none:#3a424d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--tx); }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.35rem; margin:8px 0 14px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:14px; margin-bottom:14px; }
  .hero { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .ring { position:relative; width:170px; height:170px; flex:none; margin:0 auto; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .ring .c b { font-size:1.9rem; line-height:1; }
  .ring .c span { font-size:.75rem; color:var(--mut); margin-top:4px; }
  .stats { flex:1; min-width:220px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat b { display:block; font-size:1.15rem; }
  .stat span { color:var(--mut); font-size:.78rem; }
  label { font-size:.85rem; color:var(--mut); display:block; margin-bottom:4px; }
  input { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--bd); border-radius:10px; padding:10px; width:100%; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:var(--ac); color:#fff; cursor:pointer; }
  button.sec { background:transparent; color:var(--ac); border:1px solid var(--bd); }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  .row > div { flex:1; min-width:120px; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal .h { text-align:center; font-size:.7rem; color:var(--mut); }
  .cell { aspect-ratio:1/1.05; border-radius:8px; background:var(--none); color:#fff; border:2px solid transparent;
          display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:.7rem; cursor:pointer; padding:0; line-height:1.15; }
  .cell b { font-size:.9rem; }
  .cell.ok { background:var(--ok); } .cell.near { background:var(--near); color:#1b1f24; } .cell.low { background:var(--low); }
  .cell.none { background:var(--none); color:var(--tx); opacity:.75; }
  .cell.future { opacity:.4; }
  .cell.sel { border-color:var(--tx); }
  .cell.today { box-shadow:0 0 0 2px var(--ac); }
  .blank { visibility:hidden; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:.75rem; color:var(--mut); margin-top:10px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  #chart { width:100%; height:200px; display:block; }
  .msg { font-size:.85rem; color:var(--mut); min-height:1.2em; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  td { padding:7px 0; border-top:1px solid var(--bd); }
  tr:first-child td { border-top:0; }
  td:last-child { text-align:right; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>👟 Passos até 31 de dezembro</h1>

  <section class="card hero">
    <div class="ring">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="12"/>
        <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
      </svg>
      <div class="c"><b id="pct">0%</b><span id="left">faltam —</span></div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card">
    <h2>Registar passos</h2>
    <div class="row">
      <div><label for="date">Dia</label><input type="date" id="date"></div>
      <div><label for="steps">Passos</label><input type="number" id="steps" inputmode="numeric" min="0" placeholder="ex.: 18500"></div>
      <button id="save">Guardar</button>
      <button class="sec" id="clear">Apagar</button>
    </div>
    <div class="row" style="margin-top:12px">
      <div><label for="base">Média de 2026 até ao fim de 8 nov (312 dias)</label><input type="number" id="base" inputmode="decimal" min="1" step="any"></div>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2>Calendário</h2>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>meta cumprida</span>
      <span><i style="background:var(--near)"></i>perto (≥ 80 %)</span>
      <span><i style="background:var(--low)"></i>abaixo</span>
      <span><i style="background:var(--none)"></i>sem registo</span>
    </div>
  </section>

  <section class="card">
    <h2>Passos por dia</h2>
    <svg id="chart" viewBox="0 0 600 200" preserveAspectRatio="none"></svg>
    <div class="legend"><span>Linha tracejada = meta diária (<span id="glab"></span>)</span></div>
  </section>

  <section class="card">
    <h2>Resumo do período</h2>
    <table id="sum"></table>
  </section>

  <section class="card">
    <div class="row">
      <button class="sec" id="exp">Exportar JSON</button>
      <button class="sec" id="csv">Exportar CSV</button>
      <button class="sec" id="imp">Importar JSON</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
    <div class="msg">Os dados ficam guardados neste browser. Exporta de vez em quando para teres cópia de segurança.</div>
  </section>
</main>

<script>
(function () {
  var KEY = 'passos-2026-v1';
  // Objetivo: 15 000 passos de média diária em 2026 (365 dias).
  // Até ao fim de 8 nov (312 dias) a média era 14 510; o registo começa a 9 nov.
  var START = '2026-11-09', END = '2026-12-31', NEAR = 0.8;
  var YEAR_DAYS = 365, YEAR_AVG = 15000, BASE_DAYS = 312;
  var state = { base: 14510, steps: {} };
  var sel = null;

  function $(id) { return document.getElementById(id); }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && s.steps) state = { base: s.base > 0 ? s.base : 14510, steps: s.steps };
    } catch (e) {}
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { say('Não foi possível guardar neste browser. Usa "Exportar JSON".'); }
  }
  function say(t) { $('msg').textContent = t; }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toKey(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function fromKey(k) { var p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function todayKey() { var n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()); }
  function allDays() {
    var out = [], d = fromKey(START), e = fromKey(END);
    while (d <= e) { out.push(toKey(d)); d = new Date(d.getTime() + 86400000); }
    return out;
  }
  var MO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  function label(k) { var d = fromKey(k); return d.getUTCDate() + ' ' + MO[d.getUTCMonth()]; }
  function fmt(n) { return Math.round(n).toLocaleString('pt-PT'); }
  function short(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace('.', ',') + 'k' : String(n); }

  function render() {
    var days = allDays(), today = todayKey(), N = days.length;
    var baseTotal = state.base * BASE_DAYS, yearTotal = YEAR_AVG * YEAR_DAYS;
    var toGo = Math.max(0, yearTotal - baseTotal);          // passos necessários desde 9 nov
    var g = toGo / N;                                        // meta diária para fechar o ano
    var logged = days.filter(function (k) { return state.steps[k] != null; });
    var total = logged.reduce(function (a, k) { return a + state.steps[k]; }, 0);
    var avg = logged.length ? total / logged.length : 0;     // média desde 9 nov
    var missing = Math.max(0, toGo - total);
    var remaining = days.filter(function (k) { return k >= today && state.steps[k] == null; }).length;
    var pace = logged.length ? avg : state.base;             // ritmo usado na projeção
    var projYear = (baseTotal + total + pace * remaining) / YEAR_DAYS;
    var curYear = (baseTotal + total) / (BASE_DAYS + logged.length);
    var need = remaining ? missing / remaining : 0;
    var pct = toGo ? Math.min(100, 100 * total / toGo) : 100;

    $('arc').setAttribute('stroke-dasharray', pct + ' 100');
    $('pct').textContent = Math.round(pct) + '%';
    $('left').textContent = missing ? 'faltam ' + fmt(missing) : 'meta atingida!';

    var st = [
      [fmt(curYear), 'média atual de 2026'],
      [fmt(g), 'meta diária (de 9 nov a 31 dez)'],
      [fmt(total), 'total acumulado desde 9 nov'],
      [fmt(projYear), 'média projetada a 31 dez'],
      [logged.length ? fmt(avg) : '—', 'média diária desde 9 nov'],
      [remaining ? fmt(need) : '—', 'necessário / dia daqui para a frente']
    ];
    $('stats').innerHTML = st.map(function (s) {
      return '<div class="stat"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>';
    }).join('');

    $('base').value = state.base;
    $('glab').textContent = fmt(g);

    // calendário (semana a começar à segunda)
    var head = ['seg','ter','qua','qui','sex','sáb','dom'].map(function (x) { return '<div class="h">' + x + '</div>'; }).join('');
    var off = (fromKey(days[0]).getUTCDay() + 6) % 7, cells = '';
    for (var b = 0; b < off; b++) cells += '<div class="blank"></div>';
    days.forEach(function (k, idx) {
      var v = state.steps[k], cls = 'none';
      if (v != null) cls = v >= g ? 'ok' : v >= g * NEAR ? 'near' : 'low';
      var d = fromKey(k), mo = (idx === 0 || d.getUTCDate() === 1) ? ' ' + MO[d.getUTCMonth()] : '';
      cells += '<button class="cell ' + cls + (k > today ? ' future' : '') + (k === today ? ' today' : '') + (k === sel ? ' sel' : '') +
        '" data-k="' + k + '"><b>' + d.getUTCDate() + mo + '</b><span>' + (v != null ? short(v) : '·') + '</span></button>';
    });
    $('cal').innerHTML = head + cells;

    // gráfico
    var W = 600, H = 200, bw = W / N, best = logged.reduce(function (a, k) { return Math.max(a, state.steps[k]); }, 0);
    var max = Math.max(g, best, 1) * 1.12;
    var bars = days.map(function (k, j) {
      var v = state.steps[k]; if (v == null) return '';
      var h = H * v / max, c = v >= g ? 'var(--ok)' : v >= g * NEAR ? 'var(--near)' : 'var(--low)';
      return '<rect x="' + (j * bw + 1) + '" y="' + (H - h) + '" width="' + Math.max(1, bw - 2) + '" height="' + h +
        '" rx="2" fill="' + c + '"><title>' + label(k) + ': ' + fmt(v) + '</title></rect>';
    }).join('');
    var gy = H - H * g / max;
    $('chart').innerHTML = bars + '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy +
      '" stroke="var(--tx)" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>';

    // resumo
    var above = logged.filter(function (k) { return state.steps[k] >= g; }).length;
    var rows = [
      ['Total', fmt(total)],
      ['Média por dia registado', fmt(avg)],
      ['Dias registados', logged.length + ' de ' + N],
      ['Dias acima da meta', above],
      ['Dias abaixo da meta', logged.length - above],
      ['Melhor dia', best ? fmt(best) : '—']
    ];
    $('sum').innerHTML = rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('');
  }

  function pick(k) {
    sel = k; $('date').value = k;
    var v = state.steps[k]; $('steps').value = v != null ? v : '';
    render();
  }
  function setDay(k, v) {
    if (v === '' || v == null || isNaN(v) || +v < 0) delete state.steps[k];
    else state.steps[k] = Math.round(+v);
    persist(); render();
  }
  function download(name, text, type) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }

  $('save').onclick = function () {
    var k = $('date').value, v = $('steps').value;
    if (!k || k < START || k > END) return say('Escolhe uma data entre 9 nov e 31 dez de 2026.');
    if (v === '') return say('Indica o número de passos.');
    sel = k; setDay(k, v); say('Guardado: ' + label(k) + ' — ' + fmt(v) + ' passos.');
  };
  $('clear').onclick = function () {
    var k = $('date').value; if (!k || state.steps[k] == null) return say('Esse dia não tem registo.');
    setDay(k, ''); $('steps').value = ''; say('Registo de ' + label(k) + ' apagado.');
  };
  $('base').onchange = function (e) {
    var v = parseFloat(e.target.value); if (v > 0) { state.base = v; persist(); render(); }
  };
  $('date').onchange = function (e) { if (e.target.value) pick(e.target.value); };
  $('cal').onclick = function (e) {
    var c = e.target.closest('.cell'); if (c) { pick(c.dataset.k); $('steps').focus(); }
  };
  $('exp').onclick = function () { download('passos-2026.json', JSON.stringify(state, null, 2), 'application/json'); };
  $('csv').onclick = function () {
    var rows = ['data,passos'].concat(Object.keys(state.steps).sort().map(function (k) { return k + ',' + state.steps[k]; }));
    download('passos-2026.csv', rows.join('\n'), 'text/csv');
  };
  $('imp').onclick = function () { $('file').click(); };
  $('file').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var s = JSON.parse(r.result);
        if (!s || typeof s.steps !== 'object') throw 0;
        state = { base: s.base > 0 ? s.base : 14510, steps: s.steps };
        persist(); render(); say('Dados importados.');
      } catch (x) { say('Ficheiro inválido.'); }
    };
    r.readAsText(f); e.target.value = '';
  };

  load();
  $('date').min = START; $('date').max = END;
  var t = todayKey();
  pick(t < START ? START : t > END ? END : t);
})();
</script>
</body>
</html>
